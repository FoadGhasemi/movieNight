{% extends 'base.html' %}
{% block content %}
<style>
    .petition-card {
      border-radius: 12px;
      padding: 2px;
      background: linear-gradient(90deg, #d53369 0%, #daae51 100%);
      max-width: 600px;
      margin: 3rem auto;
    }
    .petition-surface {
      background: #111;
      border-radius: 10px;
      padding: 2rem;
      color: rgba(255, 255, 255, 0.9);
    }
    .vote-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1.5rem;
    }
    .btn-gradient {
      background: linear-gradient(90deg, #d53369 0%, #daae51 50%, #6a11cb 100%);
      border: none;
      color: white;
      padding: 0.6rem 1.25rem;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    .btn-gradient:hover {
      opacity: 0.85;
    }
    .vote-counts {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 0.5rem;
    }
    .badge-yes {
      background: #4caf50;
      color: #fff;
      padding: 0.35rem 1.1rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1.08rem;
      display: inline-block;
      letter-spacing: 0.02em;
      box-shadow: none;
      border: none;
      cursor: default;
    }
    .badge-no {
      background: #e53935;
      color: #fff;
      padding: 0.35rem 1.1rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1.08rem;
      display: inline-block;
      letter-spacing: 0.02em;
      box-shadow: none;
      border: none;
      cursor: default;
    }
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    #edit-vote {
      display: none;
      margin-top: 1rem;
      justify-content: center;
      gap: 1rem;
    }
    .created-by {
      color: #b44aff;
      font-weight: 600;
    }
</style>

<div class="petition-card">
    <div class="petition-surface">
        <h1>{{ movie.title }}</h1>
        <img src="{{ movie.poster_url }}" alt="{{ movie.title }}">

        {% if user_entry %}
        <!-- Show their personal tracking info -->
        <h4>Your Status: {{ user_entry.get_status_display }}</h4>
        <p>Rating: {{ user_entry.rating }}/10</p>
        <a href="{% url 'movie:update' user_entry.pk %}">Edit my entry</a>
        {% else %}
        <p>description: {{ movie.description }}</p>
        <!-- Show a button to add it -->
        <div>
            <form method="POST" action="{% url 'movie:add_from_api' %}">
                {% csrf_token %}
                <input type="hidden" name="tmdb_id" value="{{ movie.id }}">
                <input type="hidden" name="title" value="{{ movie.title }}">
                <input type="hidden" name="release_year" value="{{ movie.release_year }}">
                <input type="hidden" name="poster_url" value="{{ movie.poster_url }}">

                <button class="btn btn-gradient create-petition-btn btn-sm" type="submit">Add to My Movies
                </button>
        </div>
        {% endif %}
    </div>
</div>
</div>
<script>
    setTimeout(() => {
      const flash = document.getElementById('flash-messages');
      if (flash) {
        flash.style.transition = "opacity 0.5s ease";
        flash.style.opacity = "0";
        setTimeout(() => flash.remove(), 500);
      }
    }, 1500); // 3 seconds
</script>
{% endblock %}
