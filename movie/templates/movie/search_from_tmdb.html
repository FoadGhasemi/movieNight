{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 mb-5">
    <h2 class="mb-4 text-white">Petitions</h2>
    <hr class="text-white"/>

    <p class="card-text">
    <form method="GET">
        <div class="row">
            <div class="col-auto">
                <div class="input-group col-auto">
                    <input
                            type="text"
                            name="q"
                            class="form-control search-input"
                            placeholder="Search movies..."
                            value="{{ q }}"
                    >
                </div>
            </div>
            <div class="col-auto">
                <button class="btn btn-gradient" type="submit">Search</button>
            </div>
        </div>
    </form>
    </p>

    {% if q %}
    <div class="row">
        {% for movie in object_list %}
        <div class="col-md-6 col-lg-4 mb-4">
            <div
                    class="card shadow-sm h-100"
                    style="
          background-color: #111;
          color: white;
          border-radius: 2rem;
          border: 2px solid;
          border-image-slice: 1;
          border-width: 2px;
          border-image-source: linear-gradient(45deg, #ff6ec4, #7873f5);
          transition: transform 0.3s ease, box-shadow 0.3s ease;
        "
            >
                <div class="card-body d-flex flex-column" style="border-radius: 2rem">
                    <h4 class="card-title">{{ movie.title }}</h4>
                    <br>
                    description:
                    <p class="card-text">{{ movie.description|truncatewords:20 }}</p>
                    <div class="mt-auto">
                        <a
                                href="{% url 'movie:detail' movie.id %}"
                                class="btn btn-gradient create-petition-btn btn-sm"
                        >
                            View Petition
                        </a>
                    </div>
                    <div>
                        <form method="POST" action="{% url 'movie:add_from_api' %}">
                            {% csrf_token %}
                            <input type="hidden" name="tmdb_id" value="{{ movie.id }}">
                            <input type="hidden" name="title" value="{{ movie.title }}">
                            <input type="hidden" name="release_year" value="{{ movie.release_year }}">
                            <input type="hidden" name="poster_url" value="{{ movie.poster_url }}">

                            <button class="btn btn-gradient create-petition-btn btn-sm" type="submit">Add to My Movies
                            </button>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <p>No movie yet.</p>
    </div>
    {% endfor %}
    {% endif %}
</div>
<script>
    document.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("mouseenter", () => {
        card.style.transform = "scale(1.03)";
        card.style.boxShadow = "0 8px 20px rgba(255, 110, 196, 0.6)";
      });
      card.addEventListener("mouseleave", () => {
        card.style.transform = "scale(1)";
        card.style.boxShadow = "none";
      });
    });
</script>

<style>
    .btn-gradient.create-petition-btn {
      background: linear-gradient(90deg, #ff6ec4 0%, #7873f5 100%);
      color: #fff;
      padding: 0.85rem 2.2rem;
      font-weight: 700;
      border: none;
      border-radius: 2rem;
      font-size: 1.2rem;
      box-shadow: 0 4px 14px rgba(120, 115, 245, 0.15);
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1),
        filter 0.15s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }
    .card .btn-gradient.create-petition-btn {
      padding: 0.4rem 1rem;
      font-size: 0.9rem;
      border-radius: 1rem;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(120, 115, 245, 0.1);
    }
    .btn-gradient.create-petition-btn:hover,
    .btn-gradient.create-petition-btn:focus {
      filter: brightness(1.12);
      transform: scale(1.045);
      box-shadow: 0 6px 24px rgba(255, 110, 196, 0.25);
      text-decoration: none;
      color: #fff;
    }
</style>
{% endblock %}
